# omakux — hyprland.conf (semilla estática)
# colores: colors.conf (generado por omakux theme set)
# teclado/input: input.conf (generado en la instalación)
# gpu: gpu.conf (generado en la instalación)
# tus overrides: ~/.config/hypr/local.conf (se carga al final, nunca se sobreescribe)

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/gpu.conf
source = ~/.config/hypr/local.conf

$mainMod = SUPER
$terminal = alacritty
$filemanager = nautilus
$browser = chromium
$scripts = ~/.config/hypr/scripts

monitor = ,preferred,auto,1

# ─── arranque de sesión ────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = $scripts/autostart.sh
exec-once = $scripts/wallpaper.sh
exec-once = waybar
exec-once = dunst
exec-once = cliphist store
exec-once = hypridle

# ─── entorno ───────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# ─── input (heredado a input.conf) ─────────────────────────────────

# ─── apariencia ────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $border_active
    col.inactive_border = $border_inactive
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.97

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = $shadow_color
    }
}

animations {
    enabled = true
    bezier = omx, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, omx, popin 85%
    animation = windowsOut, 1, 3, omx, popin 85%
    animation = border, 1, 5, omx
    animation = fade, 1, 3, omx
    animation = workspaces, 1, 3, omx, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
    vfr = true
    middle_click_paste = false
}

# ─── ventanas flotantes ────────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(galculator)$
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(wofi)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 900 600, class:^(wofi)$
windowrulev2 = center, class:^(wofi)$
windowrulev2 = opacity 0.97 0.97, class:^(Alacritty)$

# ─── atajos ────────────────────────────────────────────────────────
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, $scripts/powermenu.sh
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, fullscreen,
bind = $mainMod, T, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, exec, $scripts/clipboard.sh
bind = $mainMod, SPACE, exec, $scripts/launcher.sh
bind = $mainMod SHIFT, SPACE, exec, omakux menu
bind = $mainMod, D, exec, $scripts/launcher.sh
bind = $mainMod, SLASH, exec, $scripts/powermenu.sh

# mover foco
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# grupos
bind = $mainMod, G, togglegroup,
bind = $mainMod SHIFT, G, movegroupwindow, b

# espacios de trabajo 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# redimensionar (con repetición)
binde = $mainMod CTRL, h, resizeactive, -40 0
binde = $mainMod CTRL, l, resizeactive, 40 0
binde = $mainMod CTRL, k, resizeactive, 0 -40
binde = $mainMod CTRL, j, resizeactive, 0 40

# multimedia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && $scripts/osd.sh volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && $scripts/osd.sh volume
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && $scripts/osd.sh volume
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send -u low "Micrófono" "Estado cambiado"
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10% && $scripts/osd.sh brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%- && $scripts/osd.sh brightness
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# capturas
bind = , Print, exec, $scripts/screenshot.sh area
bind = SHIFT, Print, exec, $scripts/screenshot.sh full
bind = $mainMod, Print, exec, $scripts/screenshot.sh screen
bind = $mainMod SHIFT, S, exec, $scripts/screenshot.sh area
bind = $mainMod SHIFT, R, exec, $scripts/record.sh toggle

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
